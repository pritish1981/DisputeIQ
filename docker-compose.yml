services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: disputeiq
      POSTGRES_USER: disputeiq
      POSTGRES_PASSWORD: disputeiq
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - disputeiq_postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  disputeiq_postgres:
